<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 后端输出前端 Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #prompt { width: 80%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; min-height: 100px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>后端 LLM 输出到前端 Demo</h1>
    
    <label>输入提示词：</label>
    <input id="prompt" type="text" value="用中文解释一下什么是AI应用工程师这个岗位需要具备的技能" />
    <button onclick="callLLM()">调用 LLM</button>
    
    <div id="result"></div>

    <script>
        async function callLLM() {
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在调用后端 LLM...';

            try {
                const response = await fetch('http://localhost:8000/llm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                resultDiv.innerHTML = `<strong>LLM 输出：</strong><br>${data.result}`;
            } catch (error) {
                resultDiv.innerHTML = `错误：${error.message}`;
            }
        }
    </script>
</body>
</html>
