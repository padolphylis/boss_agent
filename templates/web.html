<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求职助手</title>
  <style>
    :root { font-family: Inter, "Microsoft YaHei", sans-serif; color: #172033; background: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f7fb; }
    button, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; padding: 26px 16px; background: #fff; border-right: 1px solid #e9ebf2; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 30px; font-weight: 700; font-size: 18px; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: #fff; background: #5b67e8; font-size: 15px; }
    .new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 14px; color: #fff; background: #5965e8; border: 0; border-radius: 8px; cursor: pointer; }
    .nav-title { margin: 28px 12px 10px; color: #9ba2b2; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .history { display: flex; flex-direction: column; gap: 3px; }
    .history button { padding: 10px 12px; overflow: hidden; text-align: left; white-space: nowrap; text-overflow: ellipsis; color: #626b7f; background: transparent; border: 0; border-radius: 7px; cursor: pointer; }
    .history button.active, .history button:hover { color: #3442bd; background: #f0f1ff; }
    .account { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 16px 10px 0; border-top: 1px solid #eef0f5; color: #596276; font-size: 13px; }
    .avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #5965e8; background: #e9ebff; font-weight: 700; }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 42px; background: #fff; border-bottom: 1px solid #e9ebf2; }
    .topbar h1 { margin: 0; font-size: 17px; }
    .topbar-actions { display: flex; align-items: center; gap: 18px; }
    .settings-button { padding: 7px 10px; color: #5965e8; background: #f0f1ff; border: 0; border-radius: 7px; cursor: pointer; }
    .connection { display: flex; align-items: center; gap: 7px; color: #7d8595; font-size: 12px; }
    dialog { width: min(440px, calc(100% - 32px)); padding: 0; color: #172033; background: #fff; border: 0; border-radius: 10px; box-shadow: 0 20px 70px rgba(29, 38, 75, .2); }
    dialog::backdrop { background: rgba(29, 38, 75, .35); }
    .settings { padding: 26px; }
    .settings h2 { margin: 0 0 8px; font-size: 20px; }
    .settings p { margin: 0 0 20px; color: #7a8394; font-size: 13px; line-height: 1.6; }
    .settings label { display: block; margin-top: 14px; color: #596276; font-size: 12px; font-weight: 700; }
    .settings input { width: 100%; margin-top: 6px; padding: 10px; color: #263047; border: 1px solid #dfe2ec; border-radius: 6px; outline: 0; }
    .settings-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .settings-actions button { padding: 9px 15px; border: 0; border-radius: 6px; cursor: pointer; }
    .settings-cancel { color: #596276; background: #eef0f5; }
    .settings-save { color: #fff; background: #5965e8; }
    .settings-message { min-height: 18px; margin-top: 10px; color: #d35b5b; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #29bf83; }
    .workspace { display: grid; grid-template-columns: minmax(0, 760px) 280px; gap: 34px; width: min(1080px, calc(100% - 84px)); margin: 0 auto; padding: 54px 0 35px; flex: 1; }
    .conversation { display: flex; flex-direction: column; min-height: 650px; }
    .welcome { margin: auto 0 30px; }
    .eyebrow { margin: 0 0 12px; color: #5965e8; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .welcome h2 { margin: 0 0 12px; font-size: 34px; }
    .welcome p { max-width: 500px; margin: 0; color: #7a8394; line-height: 1.7; font-size: 14px; }
    .messages { display: flex; flex-direction: column; gap: 18px; margin-bottom: 22px; }
    .message { max-width: 86%; padding: 13px 16px; border-radius: 8px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; }
    .message.user { align-self: flex-end; color: #fff; background: #5965e8; }
    .message.assistant { align-self: flex-start; color: #4d566a; background: #fff; border: 1px solid #e8eaf1; }
    .composer { padding: 12px; background: #fff; border: 1px solid #dfe2ec; border-radius: 8px; box-shadow: 0 8px 24px rgba(39, 47, 79, .06); }
    .composer textarea { display: block; width: 100%; min-height: 74px; padding: 5px 4px; resize: none; color: #263047; border: 0; outline: 0; }
    .resume-input { display: block; width: 100%; margin-top: 8px; padding: 7px 4px; color: #263047; border: 0; border-top: 1px solid #eef0f5; outline: 0; font-size: 12px; }
    .resume-input::placeholder { color: #a4aab8; }
    .composer textarea::placeholder { color: #a4aab8; }
    .status-line { margin-bottom: 12px; color: #7a8394; font-size: 12px; }
    .composer-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: #a2a8b5; font-size: 11px; }
    .send { display: grid; place-items: center; width: 36px; height: 36px; color: #fff; background: #5965e8; border: 0; border-radius: 8px; cursor: pointer; }
    .send:disabled { opacity: .5; cursor: wait; }
    .side-panel { align-self: start; padding-top: 4px; }
    .side-panel h3 { margin: 0 0 6px; font-size: 14px; }
    .side-panel > p { margin: 0 0 24px; color: #9299a8; font-size: 12px; line-height: 1.6; }
    .steps { position: relative; display: flex; flex-direction: column; gap: 18px; }
    .steps::before { position: absolute; top: 10px; bottom: 10px; left: 9px; width: 1px; background: #e2e4ed; content: ""; }
    .step { position: relative; display: flex; align-items: flex-start; gap: 12px; color: #9aa1b0; font-size: 12px; }
    .step-icon { z-index: 1; display: grid; place-items: center; width: 19px; height: 19px; color: #9aa1b0; background: #f6f7fb; border: 1px solid #dfe2ea; border-radius: 50%; font-size: 10px; }
    .step.active { color: #4653d0; font-weight: 700; }
    .step.active .step-icon { color: #fff; background: #5965e8; border-color: #5965e8; }
    .step.done { color: #647083; }
    .step.done .step-icon { color: #fff; background: #2bb982; border-color: #2bb982; }
    .tip { margin-top: 38px; padding: 14px; color: #747d90; background: #fff; border: 1px solid #e8eaf1; border-radius: 8px; font-size: 12px; line-height: 1.6; }
    @media (max-width: 850px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .topbar { padding: 0 20px; } .workspace { display: block; width: min(100% - 40px, 760px); padding-top: 30px; } .conversation { min-height: calc(100vh - 120px); } .side-panel { display: none; } .welcome h2 { font-size: 28px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">职</span><span>求职助手</span></div>
      <button class="new-chat" id="new-chat">＋ 新建对话</button>
      <div class="nav-title">最近对话</div>
      <div class="history"><button class="active">AI 应用工程师职位搜索</button><button>杭州互联网岗位筛选</button><button>简历匹配分析</button></div>
      <div class="account"><span class="avatar">我</span><span>本地工作区</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><h1>职位搜索</h1><div class="topbar-actions"><button class="settings-button" id="open-settings" type="button">设置</button><div class="connection"><span class="dot"></span>服务已连接</div></div></header>
      <div class="workspace">
        <section class="conversation">
          <div class="welcome" id="welcome"><p class="eyebrow">JOB ASSISTANT</p><h2>你好，今天想找什么工作？</h2><p>告诉我你的目标城市、职位方向和期望条件，我会帮你整理搜索任务。</p></div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="chat-form"><textarea id="message" required maxlength="500" placeholder="输入你的求职需求，例如：杭州 5-10K，本科，1-3年，AI应用工程师"></textarea><input class="resume-input" id="resume" type="text" placeholder="简历文件路径（可选，例如：C:\\resume.pdf）"><div class="composer-foot"><span>Enter 发送，Shift + Enter 换行</span><button class="send" id="send" type="submit" aria-label="发送">↑</button></div></form>
        </section>
        <aside class="side-panel"><h3>任务流程</h3><p>任务会按照以下步骤逐步执行，结果将实时显示在对话中。</p><div class="steps" id="steps"><div class="step active"><span class="step-icon">1</span><span>初始化任务</span></div><div class="step"><span class="step-icon">2</span><span>检查登录状态</span></div><div class="step"><span class="step-icon">3</span><span>读取职位页面</span></div><div class="step"><span class="step-icon">4</span><span>分析职位匹配度</span></div><div class="step"><span class="step-icon">5</span><span>等待人工确认</span></div><div class="step"><span class="step-icon">6</span><span>执行投递</span></div></div><div class="tip">涉及投递的操作将在执行前等待你的确认。</div></aside>
      </div>
    </main>
  </div>
  <dialog id="settings-dialog"><form class="settings" id="settings-form" method="dialog"><h2>基础设置</h2><p id="settings-intro">首次使用请先填写模型配置，保存后会写入本地数据库。</p><label>OpenAI API Key<input id="openai_api_key" type="password" autocomplete="off" placeholder="sk-..."></label><label>OpenAI Base URL<input id="openai_base_url" type="url" placeholder="https://api.openai.com/v1"></label><label>对话模型<input id="openai_model" type="text" placeholder="gpt-4o-mini"></label><label>向量模型<input id="embedding_model" type="text" placeholder="text-embedding-3-small"></label><div class="settings-message" id="settings-message"></div><div class="settings-actions"><button class="settings-cancel" id="close-settings" type="button">取消</button><button class="settings-save" type="submit">保存设置</button></div></form></dialog>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const resume = document.querySelector('#resume');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const welcome = document.querySelector('#welcome');
    const steps = [...document.querySelectorAll('.step')];
    const history = document.querySelector('.history');
    const settingsDialog = document.querySelector('#settings-dialog');
    const settingsForm = document.querySelector('#settings-form');
    const settingsMessage = document.querySelector('#settings-message');
    const settingsFields = ['openai_api_key', 'openai_base_url', 'openai_model', 'embedding_model'];
    const historyItems = [];
    let currentReply = null;

    document.querySelector('#new-chat').addEventListener('click', () => {
      if (send.disabled) return;
      messages.replaceChildren();
      welcome.hidden = false;
      currentReply = null;
      setStep(0);
      input.value = '';
      input.focus();
    });

    document.querySelector('#open-settings').addEventListener('click', () => {
      settingsMessage.textContent = '';
      settingsDialog.showModal();
    });

    document.querySelector('#close-settings').addEventListener('click', () => settingsDialog.close());

    settingsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(settingsFields.map((key) => [key, document.querySelector(`#${key}`).value.trim()]));
      settingsMessage.textContent = '正在保存...';
      try {
        const response = await fetch('/api/config', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '保存失败');
        settingsMessage.style.color = '#2bb982';
        settingsMessage.textContent = '设置已保存';
        setTimeout(() => settingsDialog.close(), 500);
      } catch (error) {
        settingsMessage.style.color = '#d35b5b';
        settingsMessage.textContent = error.message || '保存失败';
      }
    });

    async function loadSettings() {
      try {
        const response = await fetch('/api/config');
        const data = await response.json();
        settingsFields.filter((key) => key !== 'openai_api_key').forEach((key) => {
          document.querySelector(`#${key}`).value = data[key] || '';
        });
        if (!data.configured) {
          settingsMessage.textContent = '请先完成基础设置';
          settingsDialog.showModal();
        }
      } catch (error) {
        settingsMessage.textContent = '无法读取配置，请检查 Flask 服务';
        settingsDialog.showModal();
      }
    }

    loadSettings();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      welcome.hidden = true;
      addMessage(text, 'user');
      saveHistory(text);
      input.value = '';
      send.disabled = true;
      currentReply = addMessage('正在连接任务...', 'assistant');
      setStep(0);
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text, resume: resume.value.trim()})
        });
        if (!response.ok || !response.body) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || '请求失败');
        }
        await readSse(response.body);
      } catch (error) {
        currentReply.textContent = error.message || '暂时无法连接服务，请检查 Flask 服务是否已启动。';
        setStep(0);
      } finally {
        send.disabled = false;
        currentReply = null;
      }
    });

    async function readSse(stream) {
      const reader = stream.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop() || '';
        chunks.forEach(handleSse);
        if (done) break;
      }
    }

    function handleSse(chunk) {
      const event = chunk.match(/^event:\s*(.+)$/m)?.[1]?.trim() || 'message';
      const line = chunk.match(/^data:\s*(.+)$/m)?.[1];
      if (!line) return;
      const data = JSON.parse(line);
      if (event === 'status') {
        currentReply.textContent = data.message || data.stage || '处理中...';
        setStepForStage(data.stage);
      } else if (event === 'result') {
        currentReply.textContent = formatResult(data);
        setStep(data.error ? 0 : 5);
      } else if (event === 'error') {
        currentReply.textContent = data.message || '任务执行失败';
        setStep(0);
      }
      currentReply.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }

    function formatResult(data) {
      const lines = [data.result || data.status || '任务完成'];
      if (data.error) lines.push(`错误：${data.error}`);
      if (data.push_results?.length) {
        const ok = data.push_results.filter(item => item.success).length;
        lines.push(`投递结果：${ok}/${data.push_results.length} 成功`);
      }
      return lines.join('\n');
    }

    function setStepForStage(stage) {
      const index = ({start: 0, browser_ready: 1, jobs_fetched: 2, job_cards_fetched: 3, matched: 4, completed: 5})[stage];
      if (index !== undefined) setStep(index);
    }

    function addMessage(text, kind) {
      const item = document.createElement('div');
      item.className = `message ${kind}`;
      item.textContent = text;
      messages.appendChild(item);
      return item;
    }

    function setStep(active) {
      steps.forEach((step, index) => {
        step.classList.toggle('active', index === active);
        step.classList.toggle('done', index < active);
      });
    }

    function saveHistory(text) {
      const button = document.createElement('button');
      button.textContent = text;
      button.title = text;
      button.addEventListener('click', () => {
        input.value = text;
        input.focus();
      });
      history.prepend(button);
      historyItems.push(button);
      if (historyItems.length > 8) history.removeChild(historyItems.shift());
    }

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
